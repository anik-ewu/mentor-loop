<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Book 1:1 resume reviews, career guidance and mock interviews with an experienced software engineer."
    />
    <meta name="theme-color" content="#5b4cf0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MentorLoop · 1:1 career mentoring</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ml-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
