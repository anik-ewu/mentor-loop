services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mentorloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentorloop}
      POSTGRES_DB: mentorloop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mentorloop']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://mentorloop:${POSTGRES_PASSWORD:-mentorloop}@db:5432/mentorloop
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32-plus-chars}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      ADMIN_NAME: ${ADMIN_NAME:-Alex Morgan}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mentorloop.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
